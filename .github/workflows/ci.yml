name: CI

on:
  push:
    branches: [ main, tasarim-v2 ]
  pull_request:

jobs:
  parser:
    name: Ayristirici dogrulugu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      # Android SDK gerektirmez: parser saf JVM modulu.
      - name: Unit testler
        run: gradle :parser:test --no-daemon
      - name: Uctan uca dogrulama
        run: gradle :parser:verify --no-daemon
      - name: Test raporunu yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-test-report
          path: parser/build/reports/tests/test

  app:
    name: Android derleme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
